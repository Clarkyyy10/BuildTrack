# Render Blueprint — single service that serves BOTH the API and the React app.
# Deploy: Render -> New -> Blueprint -> pick this repo. Set the SUPABASE_* vars.
services:
  - type: web
    name: buildtrack
    runtime: node
    plan: free
    rootDir: .
    # --include=dev so build tools (tsc, vite) are available under NODE_ENV=production
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: SUPABASE_DB_HOST
        sync: false                  # e.g. aws-0-ap-southeast-1.pooler.supabase.com
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_USER
        sync: false                  # e.g. postgres.prrranhyzpgxnxaexjvo
      - key: SUPABASE_DB_PASSWORD
        sync: false                  # your Supabase DB password (secret)
      - key: SUPABASE_DB_NAME
        value: postgres
